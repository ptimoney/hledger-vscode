version: 2
updates:
  # Monthly, grouped. Minor/patch dev-dep groups are auto-merged once CI passes
  # (see workflows/dependabot-automerge.yml). Majors and runtime deps stay as
  # individual PRs for manual review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      development-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # hledger-lsp is bumped promptly by workflows/bump-hledger-lsp.yml so
      # server fixes ship fast; Dependabot's monthly cadence would hold them back.
      - dependency-name: "hledger-lsp"
      # Keep @types/vscode at minimum supported version to maintain backward compatibility
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Stay on the 6.x line: TypeScript 7 is the native compiler rewrite and no
      # longer exposes the in-process type checker API that typescript-eslint
      # needs for typed linting. Revisit once typed linting supports it.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
